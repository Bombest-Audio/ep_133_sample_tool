name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag 2.0.0 && git push origin 2.0.0
# This builds the Android APK and publishes it as a downloadable GitHub Release.
# workflow_dispatch lets you re-run against an existing tag from the Actions tab.

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. 2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build APK & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Constrain the tag before it reaches checkout `ref:` and the APK
          # filename — blocks ref/path injection from a hand-typed dispatch input.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Refusing tag '$TAG' — expected a version like 2.0.0 or 2.0.0-beta.1" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('AndroidApp/**/*.gradle*', 'AndroidApp/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Verify signing secrets present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ]      && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]    && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ]     && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing — add them under Settings → Secrets and variables → Actions" >&2
            exit 1
          fi

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS_PATH="$RUNNER_TEMP/ep133-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          if [ ! -s "$KS_PATH" ]; then
            echo "::error::Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "path=$KS_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: AndroidApp
        env:
          EP133_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          EP133_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EP133_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EP133_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Stage APK
        id: apk
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          SRC="AndroidApp/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Signed release APK not found at $SRC (signing may have failed)" >&2
            exit 1
          fi
          OUT="EP133SampleTool-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Pull this version's section out of CHANGELOG.md (everything between
          # "## [<tag>]" and the next "## [" heading).
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { grab = 0 }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'EP-133 Sample Tool %s\n' "$TAG" > release-notes.md
          fi
          # Practical install footer for the people sideloading this.
          {
            printf '\n---\n\n'
            printf '### Installing on Android\n\n'
            printf 'Grab `EP133SampleTool-<version>.apk` below, let your browser or Files app install\n'
            printf 'it (you'\''ll get a one-time "allow from this source" prompt), and open it. Plug your\n'
            printf 'KO-II in over a USB-OTG cable and you'\''re managing samples from your phone. Android\n'
            printf '10+ required.\n\n'
            printf 'First community build, sideload only, not on the Play Store yet.\n'
          } >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: EP-133 Sample Tool ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
