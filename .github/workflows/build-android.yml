name: Build · Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('AndroidApp/**/*.gradle*', 'AndroidApp/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run unit tests
        working-directory: AndroidApp
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: AndroidApp
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk

  ui-test:
    name: UI Tests (managed device)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('AndroidApp/**/*.gradle*', 'AndroidApp/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run Compose UI tests on Gradle Managed Device
        working-directory: AndroidApp
        run: ./gradlew :app:pixel2Api33DebugAndroidTest

      - name: Upload UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            AndroidApp/app/build/reports/androidTests/
            AndroidApp/app/build/outputs/androidTest-results/
