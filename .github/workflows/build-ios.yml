name: Build · iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect iOS-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # If the base commit is unavailable (new branch / force push), build to be safe.
          # Fail safe: if either commit is unavailable, run the full build.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "A base or head commit is unavailable; running the full build."
            exit 0
          fi
          # Merge-base diff (base...head) matches the PR's own changes; any diff failure also runs.
          if ! files=$(git diff --name-only "$base...$head" 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed; running the full build."
            exit 0
          fi
          printf 'changed files:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^(iOSApp/|data/|shared/|\.github/workflows/build-ios\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No iOS-relevant changes; skipping the iOS build and tests (fast pass)."
          fi

      - name: Select an iPhone simulator
        id: simulator
        if: steps.changes.outputs.run == 'true'
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.name | test("^iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: iOSApp
        run: |
          set -o pipefail
          xcodebuild -project EP133SampleTool.xcodeproj \
            -scheme EP133SampleTool \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:EP133SampleToolTests \
            test | xcbeautify --renderer github-actions

      - name: Run UI tests
        if: steps.changes.outputs.run == 'true'
        working-directory: iOSApp
        run: |
          set -o pipefail
          xcodebuild -project EP133SampleTool.xcodeproj \
            -scheme EP133SampleTool \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:EP133SampleToolUITests \
            test | xcbeautify --renderer github-actions

      - name: Build release (unsigned)
        if: steps.changes.outputs.run == 'true'
        working-directory: iOSApp
        run: |
          set -o pipefail
          xcodebuild -project EP133SampleTool.xcodeproj \
            -scheme EP133SampleTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
